<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LedgerLine Financial Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="logo-badge">LL</div>
            <h2>Sign In to LedgerLine</h2>
            <p>Access your double-entry banking ledger</p>
        </div>

        <form id="form-login">
            <div class="form-group">
                <label class="form-label" for="login-identifier">Username or Email</label>
                <input type="text" id="login-identifier" class="form-control" placeholder="e.g. john_doe or admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block btn-lg" style="margin-top:16px;">
                Sign In
            </button>
        </form>

        <div class="demo-credentials-box">
            <h4>Quick-Fill Demo Credentials</h4>
            <button type="button" class="demo-user-btn" onclick="fillDemoCredentials('john_doe', 'User@12345')">
                👤 <strong>Account Holder:</strong> john_doe / User@12345
            </button>
            <button type="button" class="demo-user-btn" onclick="fillDemoCredentials('admin', 'Admin@12345')">
                🛡️ <strong>Administrator:</strong> admin / Admin@12345
            </button>
            <button type="button" class="demo-user-btn" onclick="fillDemoCredentials('auditor_jane', 'Auditor@12345')">
                🔍 <strong>Auditor:</strong> auditor_jane / Auditor@12345
            </button>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a> &bull; <a href="index.html">Home</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
