<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BalanceWallet</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">

    <style>
        .role-selector {
            margin: 24px 0;
        }

        .role-selector h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #334155;
        }

        .role-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .role-option {
            padding: 14px 6px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            background: #f8fafc;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s ease;
        }

        .role-option:hover {
            border-color: #4f46e5;
        }

        .role-option.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .role-description {
            margin-top: 10px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }

        @media (max-width: 400px) {
            .role-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <div class="logo-badge">⚖️</div>
            <h2>Sign In to BalanceWallet</h2>
            <p>Access your double-entry banking ledger</p>
        </div>

        <div class="role-selector">
            <h3>Choose Your Login Role</h3>

            <div class="role-options">

                <button type="button"
                        class="role-option"
                        data-role="ROLE_ACCOUNT_HOLDER">
                    👤 Account Holder
                </button>

                <button type="button"
                        class="role-option"
                        data-role="ROLE_ADMIN">
                    🛡️ Admin
                </button>

                <button type="button"
                        class="role-option"
                        data-role="ROLE_AUDITOR">
                    🔍 Auditor
                </button>

            </div>

            <p class="role-description" id="role-description">
                Select your role to continue.
            </p>
            
        </div>

        <form id="form-login">

            <div class="form-group">
                <label class="form-label" for="login-identifier">
                    Username or Email
                </label>

                <input type="text"
                       id="login-identifier"
                       class="form-control"
                       placeholder="Enter your username or email"
                       required
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">
                    Password
                </label>

                <input type="password"
                       id="login-password"
                       class="form-control"
                       placeholder="Enter your password"
                       required
                       autocomplete="current-password">
            </div>

            <button type="submit"
                    id="btn-login-submit"
                    class="btn btn-primary btn-block btn-lg"
                    style="margin-top:16px;">
                Sign In
            </button>

            <p class="evaluator-note">
            Want to explore BalanceWallet? Use the demo credentials in our
           <a href="https://github.com/guttasneha2810/LedgerLine/blob/main/README.md"
               target="_blank"
               rel="noopener noreferrer">README</a>
        </p>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="register.html">Register here</a>
            &bull;
            <a href="index.html">Home</a>
        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
